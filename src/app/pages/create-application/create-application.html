<div class="min-h-screen bg-slate-50 px-8 py-10">

  <!-- Page header -->
  <div class="mb-8">
    <h1 class="text-2xl font-semibold text-slate-900">
      Create Application
    </h1>

    <p class="mt-2 text-sm text-slate-500">
      Enter the details for a new insurance application.
    </p>
  </div>

  <!-- Application form card -->
  <div class="w-full rounded-lg border border-slate-200 bg-white p-8">

    <form #applicationForm="ngForm"
    (ngSubmit)="createApplication()"
    class="space-y-6">

      <!-- Applicant name -->
      <div>
        <label for="applicantName"
               class="mb-2 block text-sm font-medium text-slate-700">
          Applicant Name
          <span class="text-red-500">*</span>
        </label>

        <input
          id="applicantName"
          name="applicantName"
          type="text"
          [(ngModel)]="application.applicantName"
          required
          placeholder="Enter applicant's full name"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
      </div>

      <!-- Insurance type -->
      <div>
        <label for="insuranceType"
               class="mb-2 block text-sm font-medium text-slate-700">
          Insurance Type
          <span class="text-red-500">*</span>
        </label>

        <select
          id="insuranceType"
          name="insuranceType"
          [(ngModel)]="application.insuranceType"
          required
          class="w-full rounded-lg border border-slate-300 bg-white px-4 py-3 text-sm text-slate-900 outline-none transition focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        >
          <option value="" disabled selected>
            Select insurance type
          </option>
          <option value="AUTO">Auto Insurance</option>
          <option value="LIFE">Life Insurance</option>
          <option value="HEALTH">Health Insurance</option>
        </select>
      </div>

      <!-- Coverage amount -->
      <div>
        <label for="coverageAmount"
               class="mb-2 block text-sm font-medium text-slate-700">
          Coverage Amount (USD)
          <span class="text-red-500">*</span>
        </label>

        <input
          id="coverageAmount"
          name="coverageAmount"
          type="number"
          [(ngModel)]="application.coverageAmount"
          min="1"
          step="0.01"
          required
          placeholder="Enter coverage amount"
          class="w-full rounded-lg border border-slate-300 px-4 py-3 text-sm text-slate-900 outline-none transition placeholder:text-slate-400 focus:border-blue-500 focus:ring-2 focus:ring-blue-100"
        />
      </div>

      <!-- Form actions -->
        <!-- Form actions -->
        <div class="flex justify-end gap-3 border-t border-slate-200 pt-6">

        <button
            type="button"
            routerLink="/applications"
            class="cursor-pointer rounded-lg border border-slate-300 bg-white px-5 py-3 text-sm font-semibold text-slate-700 transition hover:bg-slate-100"
        >
            Cancel
        </button>

        <button
            type="submit"
            class="cursor-pointer rounded-lg bg-blue-600 px-5 py-3 text-sm font-semibold text-white transition hover:bg-blue-700"
        >
            Create Application
        </button>

        </div>

    </form>

  </div>

</div>
